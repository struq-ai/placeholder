<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Struq</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #a89f93 0%, #c9bfb3 50%, #a89f93 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        .frame {
            background: #f5f3f0;
            border: 2px solid #b8b3ad;
            border-radius: 0px;
            padding: 2px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .image-wrapper {
            width: 100%;
            margin-bottom: 40px;
        }

        .image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 0px;
        }

        .content {
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            color: #5a5450;
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 1.1rem;
            color: #7a7270;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, #2e5f8a 0%, #3d7aad 100%);
            color: white;
            padding: 12px 32px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(46, 95, 138, 0.3);
        }

        @media (max-width: 640px) {
            .frame {
                padding: 24px;
            }

            h1 {
                font-size: 1.8rem;
            }

            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="frame">
            <div class="image-wrapper">
                <img src="image.jpg" alt="Struq - Elegant Design Pattern">
            </div>
        </div>
    </div>
</body>
</html>
